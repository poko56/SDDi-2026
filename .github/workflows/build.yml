name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: python -m pip install flake8
      - name: Run flake8
        run: flake8 --max-line-length=120 .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest

  build-windows:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow pillow_heif google-genai moviepy docx2pdf pypdf watchdog pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --windowed --name ZipZap --icon icon.ico
          --add-data "assets;assets" --add-data "icon.png;."
          --collect-all customtkinter --collect-all pillow_heif main.py
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ZipZap-windows
          path: dist/ZipZap
